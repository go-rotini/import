name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            tools.sum
            go.sum
            cobra/testdata/corpus/*/go.sum
            kong/testdata/corpus/*/go.sum
            urfave/testdata/corpus/*/go.sum

      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            tools.sum
            go.sum
            cobra/testdata/corpus/*/go.sum
            kong/testdata/corpus/*/go.sum
            urfave/testdata/corpus/*/go.sum

      - name: Lint
        run: make lint

  cobra-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            tools.sum
            go.sum
            cobra/testdata/corpus/*/go.sum
            kong/testdata/corpus/*/go.sum
            urfave/testdata/corpus/*/go.sum

      - name: Every supported Cobra release
        run: make test-cobra-versions

  kong-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            tools.sum
            go.sum
            cobra/testdata/corpus/*/go.sum
            kong/testdata/corpus/*/go.sum
            urfave/testdata/corpus/*/go.sum

      - name: Every supported Kong release
        run: make test-kong-versions

  urfave-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            tools.sum
            go.sum
            cobra/testdata/corpus/*/go.sum
            kong/testdata/corpus/*/go.sum
            urfave/testdata/corpus/*/go.sum

      - name: Every supported urfave/cli release
        run: make test-urfave-versions

  network-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            tools.sum
            go.sum
            cobra/testdata/corpus/*/go.sum
            kong/testdata/corpus/*/go.sum
            urfave/testdata/corpus/*/go.sum

      - name: Import Delve and kubectl
        run: go test -count=1 -run TestNetworkCorpus -v ./cobra
        env:
          ROTINI_IMPORT_NETWORK: "1"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            tools.sum
            go.sum
            cobra/testdata/corpus/*/go.sum
            kong/testdata/corpus/*/go.sum
            urfave/testdata/corpus/*/go.sum

      - name: Fuzz smoke test
        run: make test-fuzz

  race:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            tools.sum
            go.sum
            cobra/testdata/corpus/*/go.sum
            kong/testdata/corpus/*/go.sum
            urfave/testdata/corpus/*/go.sum

      - name: Race detector
        run: make test-race

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check conventional commits
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+'
          FAILED=0
          for SHA in $(git rev-list "$BASE".."$HEAD"); do
            MSG=$(git log --format=%s -n1 "$SHA")
            if ! echo "$MSG" | grep -qE "$PATTERN"; then
              echo "BAD: $MSG"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Some commits do not follow Conventional Commits (https://www.conventionalcommits.org)"
            exit 1
          fi
