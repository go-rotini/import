name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: go-rotini/.github/.github/workflows/go-ci.yml@main
    with:
      go-version: "1.27.x"
      cache-dependency-path: |
        tools.sum
        go.sum
        cobra/testdata/corpus/*/go.sum
        kong/testdata/corpus/*/go.sum
        urfave/testdata/corpus/*/go.sum
      jobs: |
        - name: test
          run: make test
          os: [ubuntu-latest, macos-latest, windows-latest]
        - name: lint
          run: make lint
        - name: cobra-versions
          run: make test-cobra-versions
        - name: kong-versions
          run: make test-kong-versions
        - name: urfave-versions
          run: make test-urfave-versions
        - name: network-corpus
          run: ROTINI_IMPORT_NETWORK=1 go test -count=1 -timeout 30m -run TestNetworkCorpus -v ./cobra ./kong ./urfave
        # The Go release go.mod declares. The corpus tests are left to the other jobs: they run go test
        # with -overlay, which go vet in this release does not read.
        - name: go-floor
          go-file: go.mod
          run: |
            go build ./...
            go vet ./...
            go test -count=1 -skip Corpus ./...
        - name: fuzz
          run: make test-fuzz
        - name: race
          run: make test-race
          os: [ubuntu-latest, macos-latest, windows-latest]
