name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    uses: go-rotini/.github/.github/workflows/go-codeql.yml@main
    with:
      go-version: "1.27.x"
      cache-dependency-path: |
        tools.sum
        go.sum
        cobra/testdata/corpus/*/go.sum
        kong/testdata/corpus/*/go.sum
        urfave/testdata/corpus/*/go.sum
