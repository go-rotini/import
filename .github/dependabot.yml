version: 2
updates:
  # go.mod requires the oldest Cobra the Cobra importer builds with on purpose, so that
  # importing never raises the Cobra version of the program it reads.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    ignore:
      - dependency-name: github.com/spf13/cobra
      - dependency-name: github.com/spf13/pflag
      - dependency-name: github.com/inconshreveable/mousetrap

  # ci(deps) so an Actions bump, which changes nothing users get, cuts no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
