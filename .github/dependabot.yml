version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # The Cobra importer's go.mod requires the oldest Cobra it builds with on purpose, so that
  # importing never raises the Cobra version of the program it reads. Only its other
  # requirements are kept current.
  - package-ecosystem: gomod
    directory: /cobra
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/spf13/cobra
      - dependency-name: github.com/spf13/pflag
      - dependency-name: github.com/inconshreveable/mousetrap

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
