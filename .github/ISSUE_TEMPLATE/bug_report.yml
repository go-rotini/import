name: Bug Report
description: Report a bug in go-rotini/import
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: tree
    attributes:
      label: Command Tree
      description: |
        The smallest command tree that shows the problem: the command
        declarations, their flags, annotations and argument validators.
      render: go

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What the description or the notes should have said.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: The description (JSON) or notes you got, and any error text.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Importer Version
      description: The go-rotini/import module and version (e.g., cobra/v0.1.0)
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: Framework Version
      description: The version of the framework the program uses (e.g., spf13/cobra v1.10.2)
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
    validations:
      required: true
