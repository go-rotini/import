name: Feature Request
description: Suggest a new feature or improvement for go-rotini/import
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: What are you trying to import? What doesn't carry across today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Mapping
      description: |
        The framework declaration and what you'd expect it to become in the
        description (and so in the rotini spec).
      render: go

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What workarounds did you try? Why don't they suffice?
